<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة توليد كلمات مرور قوية وآمنة أونلاين</title>
    <meta name="description" content="أنشئ كلمات مرور قوية، معقدة، وآمنة لحساباتك أونلاين بضغطة زر واحدة. تحكم في طول الباسورد والرموز بكل سهولة وأمان تام داخل متصفحك.">
    <meta name="keywords" content="مولد كلمات المرور, باسورد قوي, إنشأ كلمة سر آمنة, أداة توليد باسوردات">
    
    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="bg-white shadow-sm py-4 px-6 text-center">
        <h1 class="text-2xl font-bold text-indigo-600">مولد كلمات المرور الآمنة 🔒</h1>
        <p class="text-sm text-slate-500 mt-1">احمِ حساباتك بكلمات سر قوية، عشوائية، وصعبة الاختراق</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-md mx-auto p-4 sm:p-6 w-full flex-grow flex items-center">
        
        <div class="bg-white rounded-2xl shadow-md p-5 sm:p-6 w-full space-y-5">
            
            <!-- شاشة عرض الباسورد -->
            <div class="relative">
                <input type="text" id="passwordOutput" readonly class="w-full p-3.5 bg-slate-100 border border-slate-200 rounded-xl text-lg font-mono font-bold text-slate-700 focus:outline-none text-center tracking-wider" placeholder="كلمة المرور ستظهر هنا">
                <button onclick="copyPassword()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-indigo-600 text-white text-xs font-bold py-2 px-3 rounded-lg hover:bg-indigo-700 transition">
                    نسخ 📋
                </button>
            </div>

            <!-- إعدادات الطول -->
            <div class="space-y-2">
                <div class="flex justify-between text-sm font-semibold text-slate-700">
                    <span>طول كلمة المرور:</span>
                    <span id="lengthVal" class="text-indigo-600 font-bold">12</span>
                </div>
                <input type="range" id="lengthRange" min="6" max="32" value="12" class="w-full accent-indigo-600 cursor-pointer">
            </div>

            <!-- خيارات التخصيص -->
            <div class="space-y-3 border-t pt-4 text-sm">
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-slate-700">تضمين أحرف كبيرة (A-Z)</span>
                    <input type="checkbox" id="includeUppercase" checked class="w-4 h-4 accent-indigo-600 rounded">
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-slate-700">تضمين أحرف صغيرة (a-z)</span>
                    <input type="checkbox" id="includeLowercase" checked class="w-4 h-4 accent-indigo-600 rounded">
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-slate-700">تضمين أرقام (0-9)</span>
                    <input type="checkbox" id="includeNumbers" checked class="w-4 h-4 accent-indigo-600 rounded">
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-slate-700">تضمين رموز خاصة (!@#$%)</span>
                    <input type="checkbox" id="includeSymbols" checked class="w-4 h-4 accent-indigo-600 rounded">
                </label>
            </div>

            <!-- زر التوليد -->
            <button onclick="generatePassword()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                توليد كلمة مرور جديدة ⚡
            </button>

        </div>

    </main>

    <!-- الفوتر -->
    <footer class="bg-white border-t py-4 text-center text-xs text-slate-400">
        تُنشأ كلمات المرور محلياً داخل متصفحك بشكل عشوائي وآمن تماماً.
    </footer>

    <!-- سكريبت التوليد -->
    <script>
        const passwordOutput = document.getElementById('passwordOutput');
        const lengthRange = document.getElementById('lengthRange');
        const lengthVal = document.getElementById('lengthVal');
        const includeUppercase = document.getElementById('includeUppercase');
        const includeLowercase = document.getElementById('includeLowercase');
        const includeNumbers = document.getElementById('includeNumbers');
        const includeSymbols = document.getElementById('includeSymbols');

        const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
        const numberChars = '0123456789';
        const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        lengthRange.addEventListener('input', function() {
            lengthVal.textContent = this.value;
        });

        function generatePassword() {
            let chars = '';
            if (includeUppercase.checked) chars += uppercaseChars;
            if (includeLowercase.checked) chars += lowercaseChars;
            if (includeNumbers.checked) chars += numberChars;
            if (includeSymbols.checked) chars += symbolChars;

            if (chars === '') {
                alert('الرجاء اختيار خيار واحد على الأقل لتوليد كلمة المرور!');
                return;
            }

            let password = '';
            const length = parseInt(lengthRange.value);
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }

            passwordOutput.value = password;
        }

        // توليد كلمة مرور أول ما الصفحة تفتح
        window.onload = generatePassword;
        lengthRange.addEventListener('change', generatePassword);
    </script>
</body>
</html>
